# Render Blueprint — one web service that serves the React site AND the contact API.
services:
  - type: web
    name: affan-portfolio
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # GitHub Actions deploys only after the build + tests pass (see .github/workflows/ci.yml)
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CONTACT_TO
        value: affansheikh125@gmail.com
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
